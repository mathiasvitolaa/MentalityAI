version: "3.8"

# Levanta únicamente la base de datos PostgreSQL para desarrollo local.
# El backend (FastAPI) y el frontend (Next.js) se ejecutan aparte, como
# procesos normales, según las instrucciones del README.
services:
  postgres:
    image: postgres:16-alpine
    container_name: studyai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studyai
      POSTGRES_PASSWORD: studyai
      POSTGRES_DB: studyai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
